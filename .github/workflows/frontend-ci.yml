name: frontend-ci

on:
  push:
    branches:
      - main
      - feature/**
      - fix/**
      - chore/**
      - docs/**
  pull_request:
    branches:
      - main

jobs:
  frontend-check:
    name: frontend-check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run build
        run: npm run build
