[package]
name = "backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
authors = ["lhui-dev"]
description = "Backend service for r-admin."
readme = "README.md"
repository = "https://github.com/lhui-dev/r-admin"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
argon2 = "0.5.3"
axum = "0.8.6"
config = "0.15.18"
dotenvy = "0.15.7"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "macros"] }
thiserror = "2.0.17"
tokio = { version = "1.51.0", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
