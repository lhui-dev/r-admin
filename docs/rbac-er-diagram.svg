<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1380" viewBox="0 0 2200 1380">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .entity { fill: #ffffff; stroke: #2f4f6f; stroke-width: 2; rx: 10; ry: 10; }
      .header { fill: #2f4f6f; rx: 10; ry: 10; }
      .title { font: 700 24px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 700 28px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #203040; }
      .field { font: 18px 'Consolas', 'Courier New', monospace; fill: #243447; }
      .note { font: 18px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #40566f; }
      .legend { font: 16px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #40566f; }
      .line { stroke: #4c6f91; stroke-width: 3; fill: none; }
      .dash { stroke: #7e8fa3; stroke-width: 3; stroke-dasharray: 10 8; fill: none; }
      .card { font: 700 18px Arial, sans-serif; fill: #1f3550; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="2200" height="1380"/>
  <text class="subtitle" x="70" y="55">Rust + PostgreSQL + Vue3 RBAC 管理系统 E-R 图</text>
  <text class="note" x="70" y="88">说明：实线表示核心外键关系，虚线表示逻辑关联或建议关联；日志表通常按审计策略不强制外键。</text>

  <!-- sys_dept -->
  <rect class="entity" x="70" y="140" width="320" height="250"/>
  <rect class="header" x="70" y="140" width="320" height="44"/>
  <text class="title" x="90" y="170">sys_dept</text>
  <text class="field" x="90" y="210">PK  id</text>
  <text class="field" x="90" y="238">FK  parent_id</text>
  <text class="field" x="90" y="266">UK  dept_code</text>
  <text class="field" x="90" y="294">    dept_name</text>
  <text class="field" x="90" y="322">FK  leader_user_id</text>
  <text class="field" x="90" y="350">    status, sort_no</text>
  <text class="field" x="90" y="378">    created_at, updated_at</text>

  <!-- sys_user -->
  <rect class="entity" x="500" y="140" width="350" height="300"/>
  <rect class="header" x="500" y="140" width="350" height="44"/>
  <text class="title" x="520" y="170">sys_user</text>
  <text class="field" x="520" y="210">PK  id</text>
  <text class="field" x="520" y="238">UK  username</text>
  <text class="field" x="520" y="266">    password_hash</text>
  <text class="field" x="520" y="294">    nickname, real_name</text>
  <text class="field" x="520" y="322">UK  mobile, email</text>
  <text class="field" x="520" y="350">FK  dept_id</text>
  <text class="field" x="520" y="378">    is_super_admin, status</text>
  <text class="field" x="520" y="406">    last_login_at, last_login_ip</text>
  <text class="field" x="520" y="434">    created_at, updated_at</text>

  <!-- sys_user_role -->
  <rect class="entity" x="960" y="170" width="280" height="190"/>
  <rect class="header" x="960" y="170" width="280" height="44"/>
  <text class="title" x="980" y="200">sys_user_role</text>
  <text class="field" x="980" y="240">PK  id</text>
  <text class="field" x="980" y="268">FK  user_id</text>
  <text class="field" x="980" y="296">FK  role_id</text>
  <text class="field" x="980" y="324">UK  (user_id, role_id)</text>

  <!-- sys_role -->
  <rect class="entity" x="1360" y="140" width="320" height="250"/>
  <rect class="header" x="1360" y="140" width="320" height="44"/>
  <text class="title" x="1380" y="170">sys_role</text>
  <text class="field" x="1380" y="210">PK  id</text>
  <text class="field" x="1380" y="238">UK  role_code</text>
  <text class="field" x="1380" y="266">    role_name</text>
  <text class="field" x="1380" y="294">    data_scope</text>
  <text class="field" x="1380" y="322">    is_builtin, status</text>
  <text class="field" x="1380" y="350">    created_at, updated_at</text>
  <text class="field" x="1380" y="378">    remark</text>

  <!-- sys_role_permission -->
  <rect class="entity" x="1760" y="170" width="320" height="190"/>
  <rect class="header" x="1760" y="170" width="320" height="44"/>
  <text class="title" x="1780" y="200">sys_role_permission</text>
  <text class="field" x="1780" y="240">PK  id</text>
  <text class="field" x="1780" y="268">FK  role_id</text>
  <text class="field" x="1780" y="296">FK  permission_id</text>
  <text class="field" x="1780" y="324">UK  (role_id, permission_id)</text>

  <!-- sys_permission -->
  <rect class="entity" x="1760" y="500" width="360" height="280"/>
  <rect class="header" x="1760" y="500" width="360" height="44"/>
  <text class="title" x="1780" y="530">sys_permission</text>
  <text class="field" x="1780" y="570">PK  id</text>
  <text class="field" x="1780" y="598">UK  permission_code</text>
  <text class="field" x="1780" y="626">    permission_name</text>
  <text class="field" x="1780" y="654">    permission_type</text>
  <text class="field" x="1780" y="682">    http_method</text>
  <text class="field" x="1780" y="710">    api_path</text>
  <text class="field" x="1780" y="738">    status</text>
  <text class="field" x="1780" y="766">    created_at, updated_at</text>

  <!-- sys_menu -->
  <rect class="entity" x="1340" y="500" width="330" height="310"/>
  <rect class="header" x="1340" y="500" width="330" height="44"/>
  <text class="title" x="1360" y="530">sys_menu</text>
  <text class="field" x="1360" y="570">PK  id</text>
  <text class="field" x="1360" y="598">FK  parent_id</text>
  <text class="field" x="1360" y="626">    menu_name</text>
  <text class="field" x="1360" y="654">    menu_type</text>
  <text class="field" x="1360" y="682">    route_name, route_path</text>
  <text class="field" x="1360" y="710">    component_path</text>
  <text class="field" x="1360" y="738">    permission_code</text>
  <text class="field" x="1360" y="766">    visible, keep_alive</text>
  <text class="field" x="1360" y="794">    created_at, updated_at</text>

  <!-- sys_post -->
  <rect class="entity" x="70" y="560" width="300" height="230"/>
  <rect class="header" x="70" y="560" width="300" height="44"/>
  <text class="title" x="90" y="590">sys_post</text>
  <text class="field" x="90" y="630">PK  id</text>
  <text class="field" x="90" y="658">UK  post_code</text>
  <text class="field" x="90" y="686">    post_name</text>
  <text class="field" x="90" y="714">    sort_no, status</text>
  <text class="field" x="90" y="742">    created_at, updated_at</text>

  <!-- sys_user_post -->
  <rect class="entity" x="450" y="560" width="300" height="190"/>
  <rect class="header" x="450" y="560" width="300" height="44"/>
  <text class="title" x="470" y="590">sys_user_post</text>
  <text class="field" x="470" y="630">PK  id</text>
  <text class="field" x="470" y="658">FK  user_id</text>
  <text class="field" x="470" y="686">FK  post_id</text>
  <text class="field" x="470" y="714">UK  (user_id, post_id)</text>

  <!-- sys_dict_type -->
  <rect class="entity" x="840" y="560" width="300" height="220"/>
  <rect class="header" x="840" y="560" width="300" height="44"/>
  <text class="title" x="860" y="590">sys_dict_type</text>
  <text class="field" x="860" y="630">PK  id</text>
  <text class="field" x="860" y="658">UK  dict_code</text>
  <text class="field" x="860" y="686">    dict_name</text>
  <text class="field" x="860" y="714">    status</text>
  <text class="field" x="860" y="742">    created_at, updated_at</text>

  <!-- sys_dict_item -->
  <rect class="entity" x="840" y="870" width="320" height="280"/>
  <rect class="header" x="840" y="870" width="320" height="44"/>
  <text class="title" x="860" y="900">sys_dict_item</text>
  <text class="field" x="860" y="940">PK  id</text>
  <text class="field" x="860" y="968">FK  dict_type_id</text>
  <text class="field" x="860" y="996">    item_label</text>
  <text class="field" x="860" y="1024">    item_value</text>
  <text class="field" x="860" y="1052">    item_color</text>
  <text class="field" x="860" y="1080">    is_default, status</text>
  <text class="field" x="860" y="1108">    created_at, updated_at</text>

  <!-- sys_config -->
  <rect class="entity" x="1260" y="900" width="340" height="250"/>
  <rect class="header" x="1260" y="900" width="340" height="44"/>
  <text class="title" x="1280" y="930">sys_config</text>
  <text class="field" x="1280" y="970">PK  id</text>
  <text class="field" x="1280" y="998">UK  config_key</text>
  <text class="field" x="1280" y="1026">    config_name</text>
  <text class="field" x="1280" y="1054">    config_value</text>
  <text class="field" x="1280" y="1082">    value_type</text>
  <text class="field" x="1280" y="1110">    is_builtin, status</text>

  <!-- sys_login_log -->
  <rect class="entity" x="1660" y="900" width="420" height="250"/>
  <rect class="header" x="1660" y="900" width="420" height="44"/>
  <text class="title" x="1680" y="930">sys_login_log</text>
  <text class="field" x="1680" y="970">PK  id</text>
  <text class="field" x="1680" y="998">    username</text>
  <text class="field" x="1680" y="1026">    login_status, login_message</text>
  <text class="field" x="1680" y="1054">    login_ip, login_location</text>
  <text class="field" x="1680" y="1082">    browser, os, user_agent</text>
  <text class="field" x="1680" y="1110">    login_at</text>

  <!-- sys_operation_log -->
  <rect class="entity" x="1660" y="1180" width="450" height="170"/>
  <rect class="header" x="1660" y="1180" width="450" height="44"/>
  <text class="title" x="1680" y="1210">sys_operation_log</text>
  <text class="field" x="1680" y="1250">PK  id, operator_user_id, operator_name</text>
  <text class="field" x="1680" y="1278">    request_path, permission_code, request_method</text>
  <text class="field" x="1680" y="1306">    request_params(jsonb), response_body(jsonb)</text>
  <text class="field" x="1680" y="1334">    operation_status, duration_ms, operated_at</text>

  <!-- relationships -->
  <path class="line" d="M390 260 L500 260"/>
  <text class="card" x="420" y="248">1</text>
  <text class="card" x="478" y="248">N</text>

  <path class="line" d="M850 255 L960 255"/>
  <text class="card" x="880" y="243">1</text>
  <text class="card" x="938" y="243">N</text>

  <path class="line" d="M1240 255 L1360 255"/>
  <text class="card" x="1270" y="243">N</text>
  <text class="card" x="1338" y="243">1</text>

  <path class="line" d="M1680 255 L1760 255"/>
  <text class="card" x="1705" y="243">1</text>
  <text class="card" x="1738" y="243">N</text>

  <path class="line" d="M1920 360 L1920 500"/>
  <text class="card" x="1932" y="392">N</text>
  <text class="card" x="1932" y="486">1</text>

  <path class="dash" d="M1670 650 L1760 650"/>
  <text class="card" x="1688" y="638">code</text>

  <path class="line" d="M370 650 L450 650"/>
  <text class="card" x="395" y="638">1</text>
  <text class="card" x="428" y="638">N</text>

  <path class="line" d="M600 560 L640 440 L640 440"/>
  <text class="card" x="618" y="500">N</text>
  <text class="card" x="650" y="474">1</text>

  <path class="line" d="M840 670 L750 670"/>
  <path class="line" d="M750 670 L675 440"/>
  <text class="card" x="760" y="658">N</text>
  <text class="card" x="690" y="472">1</text>

  <path class="line" d="M990 780 L990 870"/>
  <text class="card" x="1002" y="808">1</text>
  <text class="card" x="1002" y="856">N</text>

  <path class="dash" d="M675 440 L310 560"/>
  <text class="card" x="455" y="495">leader</text>

  <path class="dash" d="M700 440 L1840 900"/>
  <text class="card" x="1160" y="650">login by username</text>

  <path class="dash" d="M700 440 L1840 1180"/>
  <text class="card" x="1160" y="900">operator_user_id</text>

  <path class="dash" d="M1490 390 L1490 500"/>
  <text class="card" x="1502" y="442">tree</text>

  <path class="dash" d="M230 390 L230 560"/>
  <text class="card" x="242" y="474">tree</text>

  <!-- legend -->
  <rect x="70" y="1230" width="1180" height="90" rx="10" ry="10" fill="#ffffff" stroke="#c8d3df" stroke-width="2"/>
  <line class="line" x1="100" y1="1260" x2="180" y2="1260"/>
  <text class="legend" x="195" y="1266">核心外键关系</text>
  <line class="dash" x1="410" y1="1260" x2="490" y2="1260"/>
  <text class="legend" x="505" y="1266">逻辑关联 / 建议关联</text>
  <text class="legend" x="100" y="1300">主链路：部门 -> 用户 -> 用户角色 -> 角色 -> 角色权限 -> 权限；菜单通过 permission_code 与权限资源对齐。</text>
  <text class="legend" x="100" y="1326">辅助链路：用户与岗位多对多，字典类型与字典项一对多，登录日志与操作日志保留审计追踪字段。</text>
</svg>
